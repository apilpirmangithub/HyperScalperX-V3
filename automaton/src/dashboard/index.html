<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperScalperX | Elite Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --text: #f0f0f0;
            --dim: #777;
            --accent: #00ff88;
            --danger: #ff4444;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            padding: 2rem;
            line-height: 1.5;
        }

        .container { max-width: 900px; margin: 0 auto; }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        h1 { font-weight: 600; font-size: 1.1rem; letter-spacing: 3px; color: var(--accent); }
        .status-dot { 
            display: inline-block; 
            width: 8px; height: 8px; 
            background: var(--accent); 
            border-radius: 50%; 
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { opacity: 0.5; box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
            100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }

        .stat-card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: transform 0.3s ease;
        }

        .stat-label { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .stat-value { font-size: 1.8rem; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
        .stat-value.pnl-pos { color: var(--accent); }
        .stat-value.pnl-neg { color: var(--danger); }

        section { margin-bottom: 3rem; }
        h2 { font-size: 0.8rem; color: var(--dim); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 2px; }

        .table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; background: var(--card); }
        th { text-align: left; padding: 1.2rem; font-size: 0.7rem; color: var(--dim); background: #1a1a1a; text-transform: uppercase; }
        td { padding: 1.2rem; border-top: 1px solid var(--border); font-size: 0.85rem; font-family: 'JetBrains Mono', monospace; }

        .side-long { color: var(--accent); }
        .side-short { color: var(--danger); }

        .empty { padding: 3rem; text-align: center; color: var(--dim); font-size: 0.8rem; background: var(--card); border-radius: 8px; }

        .log-item { margin-bottom: 8px; border-left: 2px solid #333; padding-left: 12px; transition: all 0.3s; }
        .log-item:hover { border-left-color: var(--accent); background: #111; }
        .log-time { color: #555; margin-right: 10px; }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>HYPERSCALPER X</h1>
            <div><span class="status-dot"></span> <span id="sync-status" style="font-size: 0.7rem; color: var(--dim)">SYNCING...</span></div>
        </header>

        <div class="grid">
            <div class="stat-card">
                <div class="stat-label">Total Equity</div>
                <div id="equity" class="stat-value">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Net Profit</div>
                <div id="pnl" class="stat-value">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Win Rate</div>
                <div id="winrate" class="stat-value">0%</div>
            </div>
        </div>

        <section>
            <h2>Active Positions</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Asset</th>
                            <th>Side</th>
                            <th>Size</th>
                            <th>Entry</th>
                            <th>PnL</th>
                        </tr>
                    </thead>
                    <tbody id="positions-list">
                    </tbody>
                </table>
                <div id="no-pos" class="empty" style="display: none;">No active trades. Scanning...</div>
            </div>
        </section>

        <section>
            <h2>Activity Logs</h2>
            <div id="activity-log">
            </div>
        </section>
    </div>

    <script>
        const DB_URL = "https://mytradingbot-e4f0d-default-rtdb.firebaseio.com/trading_stats.json";

        async function updateData() {
            try {
                const response = await fetch(DB_URL);
                const data = await response.json();
                
                if (!data) return;

                document.getElementById('sync-status').innerText = "LIVE • " + new Date().toLocaleTimeString();

                // Stats (with null safety)
                document.getElementById('equity').innerText = `$${(data.equity || 0).toFixed(2)}`;
                const pnlEl = document.getElementById('pnl');
                const pnlVal = data.totalPnl || 0;
                pnlEl.innerText = `${pnlVal >= 0 ? '+' : ''}$${pnlVal.toFixed(2)}`;
                pnlEl.className = `stat-value ${pnlVal >= 0 ? 'pnl-pos' : 'pnl-neg'}`;
                document.getElementById('winrate').innerText = `${(data.winRate || 0).toFixed(1)}%`;

                // Positions
                const posList = document.getElementById('positions-list');
                const noPos = document.getElementById('no-pos');
                posList.innerHTML = '';
                
                const positions = data.positions || [];
                if (positions.length === 0) {
                    noPos.style.display = 'block';
                } else {
                    noPos.style.display = 'none';
                    positions.forEach(p => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${p.asset}</td>
                            <td class="${p.side === 'LONG' ? 'side-long' : 'side-short'}">${p.side}</td>
                            <td>${(p.size || 0).toFixed(3)}</td>
                            <td>${(p.entry || 0).toFixed(4)}</td>
                            <td class="${(p.pnl || 0) >= 0 ? 'pnl-pos' : 'pnl-neg'}">${(p.pnl || 0).toFixed(2)}%</td>
                        `;
                        posList.appendChild(tr);
                    });
                }

                // Activity
                const activities = data.recentActivities || [];
                const log = document.getElementById('activity-log');
                if (activities.length > 0) {
                    log.innerHTML = activities.map(a => `
                        <div class="log-item">
                            <span class="log-time">${new Date(a.timestamp).toLocaleTimeString()}</span> 
                            <span>${a.messageEn}</span>
                        </div>
                    `).join('');
                } else {
                    log.innerHTML = '<div class="empty">No activity yet. Bot is scanning...</div>';
                }

            } catch (err) {
                document.getElementById('sync-status').innerText = "CONNECTION ERROR";
                console.error("Fetch failed:", err);
            }
        }

        // Auto update every 10 seconds
        updateData();
        setInterval(updateData, 10000);
    </script>
</body>
</html>
